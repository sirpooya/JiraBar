# XcodeGen spec. This file is the source of truth; Jirabar.xcodeproj is generated with
# `xcodegen generate` and gitignored.
name: Jirabar
options:
  bundleIdPrefix: in.pooya
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  Jirabar:
    build:
      targets:
        Jirabar: all
        JirabarTests: [test]
    test:
      targets:
        - JirabarTests

targets:
  Jirabar:
    type: application
    platform: macOS
    sources:
      - path: Jirabar
    settings:
      base:
        PRODUCT_NAME: Jirabar
        PRODUCT_BUNDLE_IDENTIFIER: in.pooya.ticketbar
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # Signing decides whether the Keychain re-prompts for the login password on every launch.
        # A Keychain item's ACL trusts the accessing app's DESIGNATED REQUIREMENT. Signed with a
        # real certificate, that requirement is identifier + anchor + leaf CN, which every future
        # rebuild still satisfies. Ad-hoc has no certificate, so the requirement can only be
        # `cdhash H"..."`, one exact build, and the next build never matches again. Clicking
        # "Always Allow" does not help there: it pins the build you clicked it on.
        # VERIFY, do not assume. This was documented as decided while the build was still coming
        # out ad-hoc, so the fix was never actually in effect:
        #   codesign -dvvv <app> | grep -E 'Authority|flags'   # want an Authority, not flags=adhoc
        #   codesign -d -r- <app>                              # want NO cdhash in the requirement
        # Three things had to be true at once to get the certificate used:
        #   1. Manual, not Automatic: Automatic asks the developer portal for a "Mac Development"
        #      profile, which xcodebuild cannot mint headlessly.
        #   2. The identity given as its SHA-1 hash, not the name "Apple Development". By name,
        #      Xcode classifies it as the "Mac Development" certificate type and then reports that
        #      no such certificate exists, even though `codesign` signs with it happily. By hash it
        #      skips that classification.
        #   3. DEVELOPMENT_TEAM set: without it, manual signing refuses outright.
        # The hash is this Mac's "Apple Development: pooyak@live.com (FTQDQPMU3H)" certificate,
        # from `security find-identity -v -p codesigning`. On a different Mac it must be replaced.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ADF79CA48A71BB7E096865C8778307573FC201B7
        PROVISIONING_PROFILE_SPECIFIER: ""
        # The team id is the certificate's OU, which is what `codesign` reports as TeamIdentifier.
        # It is NOT the id in the certificate's common name: that reads FTQDQPMU3H, and using it
        # here was wrong. Nothing caught it because the identity is pinned by SHA-1 hash, so no
        # team lookup ever ran, but it would break the moment signing moved to Automatic.
        DEVELOPMENT_TEAM: 37MA269X54
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # A dev build and the installed release coexist, each with its own defaults and its own
          # Keychain item, so testing does not clobber the real token.
          PRODUCT_BUNDLE_IDENTIFIER: in.pooya.ticketbar.debug
    info:
      path: Jirabar/Info.plist
      properties:
        CFBundleDisplayName: Jirabar
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar only: no Dock tile. The app runs .accessory and flips to .regular only while a
        # real titled window is open.
        LSUIElement: true
        NSHumanReadableCopyright: ""
    entitlements:
      path: Jirabar/Jirabar.entitlements
      properties:
        # Off. The app talks to an internal host over the VPN and writes a Keychain item; the
        # sandbox buys nothing here and complicates the Keychain ACL across rebuilds.
        com.apple.security.app-sandbox: false

  JirabarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: JirabarTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.pooya.ticketbar.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jirabar.app/Contents/MacOS/Jirabar"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ADF79CA48A71BB7E096865C8778307573FC201B7
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Must match the app target's team. A test bundle injected into a host signed under a
        # different team fails at load with a "different Team IDs" dlopen error.
        DEVELOPMENT_TEAM: 37MA269X54
    dependencies:
      - target: Jirabar
